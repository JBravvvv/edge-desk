name: Refresh live data (market-day loop)

# A long job loops for ~5.5h, force-pushing a fresh snapshot to the `data` branch
# every ~15 min (the app reads that branch via raw.githubusercontent, CORS-enabled).
#
# SELF-PERPETUATING: because GitHub's scheduler skips cron ticks unreliably (it
# skipped every morning attempt on 2026-07-06 and -07), each loop re-dispatches
# the NEXT loop just before it exits, using the REFRESH_PAT secret (a token with
# `workflow` scope — GITHUB_TOKEN can't trigger workflows). That forms an unbroken
# chain that runs day to day WITHOUT depending on cron. The crons below and manual
# `gh workflow run refresh.yml` are just backups to (re)start the chain if it ever
# breaks. concurrency + cancel-in-progress keeps exactly one loop alive.

on:
  workflow_dispatch:
  schedule:
    # GitHub's scheduler frequently SKIPS individual cron ticks, so we fire many
    # redundant attempts across the morning. Once ANY one starts the loop, the
    # ~5.66h job covers the rest of the session; extras just restart it
    # (cancel-in-progress) if an earlier tick was skipped. The odds of GitHub
    # skipping every one of these are very low.
    - cron: "31 13 * * 1-5"   # 09:31 ET
    - cron: "51 13 * * 1-5"   # 09:51 ET
    - cron: "11 14 * * 1-5"   # 10:11 ET
    - cron: "41 14 * * 1-5"   # 10:41 ET
    - cron: "11 15 * * 1-5"   # 11:11 ET
    - cron: "51 15 * * 1-5"   # 11:51 ET
    - cron: "31 16 * * 1-5"   # 12:31 ET
    - cron: "11 17 * * 1-5"   # 13:11 ET

permissions:
  contents: write

concurrency:
  group: refresh-loop
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install advisor dependencies
        run: pip install -r edge-desk-app/requirements.txt
      - name: Loop — publish snapshots to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          END=$(( $(date -u +%s) + 19800 ))   # run ~5.5h, leaving buffer for the re-arm step under the 6h cap
          while [ "$(date -u +%s)" -lt "$END" ]; do
            python edge_desk_advisor.py --snapshot /tmp/data.json || true
            if [ -s /tmp/data.json ]; then
              rm -rf /tmp/pub && mkdir /tmp/pub
              cp /tmp/data.json /tmp/pub/data.json
              ( cd /tmp/pub
                git init -q
                git checkout -q -b data
                git -c user.name="edge-desk-bot" -c user.email="actions@users.noreply.github.com" add data.json
                git -c user.name="edge-desk-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "data $(date -u +%FT%H:%MZ)"
                git push -q --force "$REMOTE" data )
              echo "published $(date -u +%H:%MZ)"
            fi
            sleep 900
          done
      # Re-arm the chain: start the next loop so we never wait on GitHub's cron.
      # Runs on success OR failure, but NOT when this run was cancelled (a
      # cancelling successor already carries the chain, so we avoid a dispatch
      # storm). Degrades gracefully to cron-only if REFRESH_PAT is unset.
      - name: Re-arm next loop
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run refresh.yml -R "$GITHUB_REPOSITORY" && echo "re-armed next loop" || echo "re-arm dispatch failed (cron backups remain)"
          else
            echo "REFRESH_PAT not set — relying on cron backups"
          fi
